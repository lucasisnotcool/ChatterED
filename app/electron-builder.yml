# Unsigned (ad-hoc signed) arm64 DMG (issue #17). A Developer ID and notarisation are a later
# milestone — architecture-mac.md §F.2 option 2 is deliberate here, not an oversight.
# Build a release with tools/release.sh; it cleans, builds, verifies the signature and hashes.
appId: sg.nus.chattered
productName: ChatterED
copyright: Copyright © 2026 the ChatterED authors
# Flips Electron's fuses, then ad-hoc signs and verifies the whole bundle. See the hook for why
# electron-builder's own `electronFuses:` key is not used (it runs after this hook).
afterPack: build/after-pack.cjs
directories:
  output: out
  buildResources: build
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  # Test scaffolding and the notices source never ship (the notices go to Resources instead).
  - '!dist/**/*.test-support.js'
  - '!dist/test-support/**'
  - '!dist/notices/**'
  # better-sqlite3 loads a prebuilt N-API binary for the running platform
  # (prebuilds/darwin-arm64.node); its SQLite and C++ sources and the other platforms'
  # binaries are ~24 MB the app never reads. node-addon-api is headers for building it.
  - '!node_modules/better-sqlite3/{deps,src,build}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/better-sqlite3/prebuilds/{darwin-x64,linux-*,linuxmusl-*,win32-*}.node'
  - '!node_modules/node-addon-api/**'
  # pdf.js's optional native canvas (27 MB of Skia). The main process only extracts text and
  # geometry, which need no canvas; pages are drawn in the renderer (vault/pdf.ts).
  - '!node_modules/@napi-rs/**'
  # pdf.js is 35 MB unpacked and the main process loads exactly one entry point of it
  # (legacy/build/pdf.mjs plus its in-process worker). The renderer has its own copy, bundled
  # by Vite into dist/renderer, so nothing else in this package is ever reached at runtime.
  - '!node_modules/pdfjs-dist/**/*'
  - node_modules/pdfjs-dist/package.json
  - node_modules/pdfjs-dist/LICENSE
  - node_modules/pdfjs-dist/legacy/build/pdf.mjs
  - node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs
  - node_modules/pdfjs-dist/wasm/**
  # Search embeddings (docs/research/search.md §4) run @huggingface/transformers on
  # onnxruntime-node in a utility process (src/main/search/embedder-worker.ts). Its Node build
  # inlines the onnxruntime-web bundle it needs, so the 140 MB package is never loaded; nor are
  # onnxruntime-node's Linux and Windows binaries (about 200 MB) or sharp's wasm fallback.
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/{linux,win32}/**'
  # npm unpacks libonnxruntime.1.dylib and libonnxruntime.1.30.0.dylib as two real 45 MB copies;
  # the binding links only @rpath/libonnxruntime.1.dylib.
  - '!node_modules/onnxruntime-node/bin/napi-v*/darwin/*/libonnxruntime.1.*.dylib'
  - '!node_modules/@img/sharp-wasm32/**'
# Licence notices for everything that ships (release review P1-8). THIRD_PARTY_NOTICES.txt is
# generated by scripts/third-party-notices.mjs during `npm run build`; Electron's LICENSE and
# Chromium's LICENSES.chromium.html come from the Electron distribution, which electron-builder
# otherwise drops.
extraResources:
  - from: dist/notices/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html
  # The search embedding model (EmbeddingGemma-300m q4, ~200 MB), bundled so search works
  # offline from first launch; never downloaded at runtime. scripts/fetch-model.mjs puts it in
  # models/ (gitignored) during `npm run build`, checking every file's sha256. Its NOTICE and
  # model card travel with it. Read from Resources/models/ by src/main/search/modelpath.ts.
  - from: models/embeddinggemma-300m
    to: models/embeddinggemma-300m
    filter:
      - '**/*'
      - '!**/*.part'
  # The study build's sealed key bundle (src/main/study/). study/keys.json exists only while
  # `tools/release.sh --study` runs, which puts it there and removes it after; any other build
  # finds just the README and ships nothing from this folder.
  - from: study
    to: study
    filter:
      - keys.json
asar: true
# pdf.js is loaded with a real dynamic `import()` of a file:// URL (src/main/vault/pdf.ts).
# Node's ESM loader does not read out of an asar archive, so this one package stays unpacked.
asarUnpack:
  - node_modules/pdfjs-dist/**
  # Native code dlopen()s its sibling dylibs through @loader_path / @rpath, which only resolve
  # on a real directory: onnxruntime-node (binding + libonnxruntime) and sharp's libvips, which
  # @huggingface/transformers loads at import.
  - node_modules/onnxruntime-node/**
  - node_modules/@img/**
mac:
  category: public.app-category.education
  # Built from assets/AppIcon.svg by tools/make-icon.sh. electron-builder resolves this
  # relative to the project directory, so the icon does not need to be in `files`.
  icon: assets/AppIcon.icns
  target:
    - target: dmg
      arch:
        - arm64
  # Electron 44's own floor (its Info.plist says 13.0); stated here so a release says it.
  minimumSystemVersion: '13.0'
  # No Developer ID yet (#17): electron-builder signs nothing, and build/after-pack.cjs
  # ad-hoc signs instead so a downloaded copy is "unverified developer", not "damaged".
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: ChatterED ${version}
  # lzfse (macOS 10.11+): smaller download than the default zlib UDZO.
  format: ULFO
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
npmRebuild: true
