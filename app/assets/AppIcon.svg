<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="peer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS squircle with the standard ~10% transparent margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <!-- Challenger bubble (back, indigo-tinted) -->
  <g filter="url(#shadow)">
    <path d="M470 250 h300 a70 70 0 0 1 70 70 v170 a70 70 0 0 1 -70 70 h-60 l-90 80 v-80 h-150 a70 70 0 0 1 -70 -70 v-170 a70 70 0 0 1 70 -70 z" fill="#A5B4FC"/>
  </g>
  <!-- Peer bubble (front, white) -->
  <g filter="url(#shadow)">
    <path d="M230 430 h360 a80 80 0 0 1 80 80 v190 a80 80 0 0 1 -80 80 h-170 l-110 95 v-95 h-80 a80 80 0 0 1 -80 -80 v-190 a80 80 0 0 1 80 -80 z" fill="url(#peer)"/>
  </g>
  <!-- explanation lines in the peer bubble -->
  <rect x="290" y="505" width="300" height="34" rx="17" fill="#4F46E5"/>
  <rect x="290" y="571" width="230" height="34" rx="17" fill="#818CF8"/>
  <rect x="290" y="637" width="180" height="34" rx="17" fill="#C7D2FE"/>
  <!-- question mark in the challenger bubble -->
  <text x="620" y="470" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="190" fill="#312E81" text-anchor="middle">?</text>
  <!-- whisper: a small tertiary bubble, mint -->
  <circle cx="760" cy="720" r="72" fill="#34D399"/>
  <circle cx="734" cy="720" r="9" fill="#064E3B"/>
  <circle cx="760" cy="720" r="9" fill="#064E3B"/>
  <circle cx="786" cy="720" r="9" fill="#064E3B"/>
</svg>
