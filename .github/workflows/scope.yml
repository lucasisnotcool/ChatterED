# The scope check from AGENTS.md: no private A2 material and no raw research data in this repo.
# It runs on GitHub for every push and PR, so the rule holds whichever editor or coding agent made
# the change, and whether or not the local pre-commit hook was enabled. The app's own checks
# (typecheck, lint, tests) run locally: see app/README.md.
name: scope
on:
  push:
  pull_request:
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check-scope.sh
